services:
  carts-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carts-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://carts-db:5432/carts_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_REDIS_HOST=host.docker.internal
      - SPRING_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=host.docker.internal
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      - carts-db
    networks:
      - carts-network

  carts-db:
    image: postgres:16-alpine
    container_name: carts-db
    environment:
      - POSTGRES_DB=carts_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - carts-db-data:/var/lib/postgresql/data
    networks:
      - carts-network


volumes:
  carts-db-data:

networks:
  carts-network:
    driver: bridge
