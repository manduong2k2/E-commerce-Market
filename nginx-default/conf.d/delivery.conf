server {
    listen 80;
    server_name deliveries.your-domain.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name deliveries.your-domain.com;

    ssl_certificate /etc/nginx/ssl/delivery/crt.pem;
    ssl_certificate_key /etc/nginx/ssl/delivery/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/deliveries;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # For PHP files, you may need to add a PHP-FPM service
        # proxy_pass http://php-fpm:9000;
        # Or serve static files only
        try_files $uri =404;
    }
}
