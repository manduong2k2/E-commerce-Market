version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - C:/Users/<username>/Desktop/E-com/Services/Billings/public:/var/www/billings:ro
      - C:/Users/<username>/Desktop/E-com/Services/Members/public:/var/www/members:ro
      - C:/Users/<username>/Desktop/E-com/Services/Deliveries/public:/var/www/deliveries:ro
